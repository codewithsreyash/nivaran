services:
  - type: web
    name: nivaran-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.13
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      - key: DATABASE_URL
        value: sqlite:///./aicte_oneview.db
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_SIZE_MB
        value: 10
      - key: UPLOAD_DIR
        value: uploads

